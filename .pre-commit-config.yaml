# .pre-commit-config.yaml
#
# Hooks run locally before every commit.
# The same checks run in CI, so a failing commit means CI will also fail.
# This surfaces problems at the earliest possible moment.
#
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements        # Catches leftover breakpoint() / pdb
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # Ruff handles both linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.7
          - pydantic-settings>=2.3
          - types-PyYAML>=6.0
          - types-python-dateutil>=2.9
        args: [--config-file=pyproject.toml]

  # Research integrity: prevent committing Jupyter notebook outputs
  # (notebooks in exploratory/ should never contain executed outputs in VCS)
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: notebooks/exploratory/.*\.ipynb$
