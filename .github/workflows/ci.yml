# .github/workflows/ci.yml
#
# Continuous Integration
#
# Runs on every push and pull request.
# All jobs must pass before a PR can merge to main.
#
# Job order:
#   lint → typecheck → test
#
# We run lint and typecheck in parallel, then tests only if both pass.
# This gives the fastest possible feedback cycle.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:      # Allow manual trigger from GitHub UI

concurrency:
  # Cancel in-progress runs for the same branch, except on main
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.11"
  MM_ENVIRONMENT: test

jobs:
  # ---------------------------------------------------------------------------
  # Lint & Format
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff>=0.4

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

  # ---------------------------------------------------------------------------
  # Type Checking
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project (foundation deps only)
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy marketmind --config-file pyproject.toml

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false      # Run all Python versions even if one fails
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            -m "not slow" \
            --cov=marketmind \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Run integration tests
        run: pytest tests/integration -m "not slow"

      - name: Run property-based tests
        run: pytest tests/property --hypothesis-seed=42

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false   # Don't fail CI for coverage upload issues

  # ---------------------------------------------------------------------------
  # Import Structure (enforces module dependency rules from architecture doc)
  # ---------------------------------------------------------------------------
  import-structure:
    name: Import Structure
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Enforce import contracts
        run: lint-imports
