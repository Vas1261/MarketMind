[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project Metadata
# ---------------------------------------------------------------------------
[project]
name = "marketmind"
version = "0.1.0"
description = "AI-Powered Financial Intelligence & Quantitative Research Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "MarketMind Contributors" }]
keywords = ["quantitative-finance", "machine-learning", "research-platform"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

# ---------------------------------------------------------------------------
# Core Runtime Dependencies
# Only include what Phase 1 genuinely requires.
# ML/data science deps are added in Phase 2.
# ---------------------------------------------------------------------------
dependencies = [
    # Configuration & settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Structured logging
    "structlog>=24.1",
    "rich>=13.7",          # Human-readable console output in development

    # CLI (scripts and research runner)
    "click>=8.1",

    # Date/time utilities
    "python-dateutil>=2.9",
]

# ---------------------------------------------------------------------------
# Optional Dependency Groups
# Install with: pip install -e ".[research]" or ".[dev]" etc.
# ---------------------------------------------------------------------------
[project.optional-dependencies]

# Phase 2 – data engineering
data = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",      # Parquet read/write
    "yfinance>=0.2",
    "exchange-calendars>=4.5",
    "scipy>=1.13",
]

# Phase 2 – machine learning
ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "shap>=0.45",
    "joblib>=1.4",
]

# Phase 2 – feature engineering optional extras
features = [
    "ta>=0.11",           # Technical analysis indicators
]

# Phase 2 – dashboard
dashboard = [
    "streamlit>=1.35",
    "plotly>=5.22",
    "altair>=5.3",
]

# Development tooling
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",  # Parallel test execution
    "hypothesis>=6.100",  # Property-based testing
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "types-python-dateutil>=2.9",
    "pre-commit>=3.7",
    "import-linter>=2.0", # Enforce module dependency rules
]

# Full install (everything)
all = [
    "marketmind[data,ml,features,dashboard,dev]",
]

# ---------------------------------------------------------------------------
# Script Entry Points
# ---------------------------------------------------------------------------
[project.scripts]
marketmind = "marketmind.cli:main"

# ---------------------------------------------------------------------------
# Hatch Configuration
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["marketmind"]

# ---------------------------------------------------------------------------
# Ruff – Linter and Formatter
#
# Rationale: Ruff replaces flake8 + isort + pyupgrade in a single fast tool.
# We do not use Black separately; Ruff's formatter is Black-compatible.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["marketmind", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking (move type-only imports into TYPE_CHECKING blocks)
    "ANN", # flake8-annotations (enforce type hints)
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
]
ignore = [
    "ANN401", # Dynamically typed expressions (Any) - occasionally necessary
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]         # Tests don't need full annotation coverage
"scripts/**/*.py" = ["ANN"]
"marketmind/**/placeholder.py" = ["ANN", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["marketmind"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# MyPy – Static Type Checking
#
# Rationale: Strict mode catches the majority of type errors that matter
# without requiring manual --disallow-* flags. Per-module overrides allow
# gradual adoption for third-party libraries that lack stubs.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
files = ["marketmind"]

[[tool.mypy.overrides]]
# Phase 2+ dependencies - stubs added when packages are installed
module = [
    "yfinance.*",
    "ta.*",
    "shap.*",
    "exchange_calendars.*",
    "xgboost.*",
    "lightgbm.*",
    "plotly.*",
    "streamlit.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "-v",
]
markers = [
    "unit: Fast, isolated tests with no I/O",
    "integration: Tests involving multiple components or controlled I/O",
    "property: Property-based tests using Hypothesis",
    "regression: Known-answer tests that detect numerical regressions",
    "slow: Tests that take longer than 5 seconds",
]
filterwarnings = [
    "error",                      # Treat all warnings as errors in tests
    "ignore::DeprecationWarning:hypothesis",
    "ignore::PendingDeprecationWarning",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["marketmind"]
branch = true
omit = [
    "marketmind/**/placeholder.py",
    "marketmind/dashboard/*",     # UI tested separately
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
fail_under = 80

# ---------------------------------------------------------------------------
# Import Linter – Enforce Module Dependency Rules
#
# These rules are the machine-enforced version of the dependency diagram
# in the architecture document. A PR that imports across a forbidden boundary
# fails CI without requiring a human reviewer to catch it.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "marketmind"

[[tool.importlinter.contracts]]
name = "Core has no infrastructure dependencies"
type = "independence"
modules = ["marketmind.core"]
ignore_imports = []

[[tool.importlinter.contracts]]
name = "Data layer only imports from core"
type = "layers"
layers = [
    "marketmind.api",
    "marketmind.dashboard",
    "marketmind.scheduler",
    "marketmind.monitoring",
    "marketmind.recommendation",
    "marketmind.explainability",
    "marketmind.evaluation",
    "marketmind.models",
    "marketmind.regime",
    "marketmind.features",
    "marketmind.research",
    "marketmind.data",
    "marketmind.config",
    "marketmind.core",
]
